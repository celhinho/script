name: FIPE Scraper Cloudflare D1

on:
  schedule:
    # Roda todo dia 1 e dia 2 de cada mês às 02:00 BRT (05:00 UTC)
    - cron: '0 5 1,2 * *'
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Rodar em Modo Teste Rápido (1 marca / 2 modelos)?'
        required: false
        type: boolean
        default: false
      referencia:
        description: 'Referência específica (vazio para detectar o mês atual da FIPE)'
        required: false
        type: string
        default: ''

jobs:
  scraper:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências Python
        run: |
          pip install requests curl_cffi

      - name: Executar Scraper e Sincronizar com Cloudflare D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c8e4a0bd11a70249ab3d57cfa3c2d4a
        run: |
          ARGS="--executar"
          if [ "${{ inputs.modo_teste }}" = "true" ]; then
            ARGS="$ARGS --modo-teste"
          fi
          if [ -n "${{ inputs.referencia }}" ]; then
            ARGS="$ARGS --ref ${{ inputs.referencia }}"
          fi
          python fipe_scraper_sqlite.py $ARGS

      - name: Fazer backup do banco SQLite nos artefatos do GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fipe-sqlite-backup-${{ github.run_id }}
          path: |
            fipe_database_v3.db
            logs/
          retention-days: 30
