# .github/workflows/fipe_scraper.yml
# Roda o scraper FIPE uma vez por mês (dia 1 às 3h horário de Brasília)
# Também pode ser disparado manualmente pelo GitHub

name: FIPE Scraper Mensal

on:
  schedule:
    - cron: '15 3 1 * *'  # dia 1 de cada mês às 03:15 UTC = 00:15 Brasília
  workflow_dispatch:      # disparo manual pela interface do GitHub

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 1940  # 24 horas máximo

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Executar scraper em modo PRODUÇÃO
        run: |
          python -c "
          from fipe_scraper_sqlite import ConfigFinal, FipeScraperFinal
          config = ConfigFinal()
          config.MODO_TESTE = False
          config.MAX_MARCAS_TESTE = None
          config.MAX_MODELOS_TESTE = None
          scraper = FipeScraperFinal(config)
          scraper.executar()
          "

      - name: Upload do banco de dados gerado
        uses: actions/upload-artifact@v4
        if: always()  # faz upload mesmo se der erro
        with:
          name: fipe-database-${{ github.run_id }}
          path: |
            fipe_database_v3.db
            logs/
          retention-days: 30  # mantém por 30 dias

      - name: Upload do log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fipe-logs-${{ github.run_id }}
          path: logs/fipe_scraper.log
          retention-days: 30
